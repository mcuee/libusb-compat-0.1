name: CMake CI

on: [push, pull_request]

jobs:
  ubuntu-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: src

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libusb-1.0-0-dev ninja-build

      - name: Configure CMake
        run: |
          cmake -B build/shared -S src -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install/shared -DBUILD_SHARED_LIBS=ON -DENABLE_EXAMPLES=ON
          cmake -B build/static -S src -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install/static -DBUILD_SHARED_LIBS=OFF -DENABLE_EXAMPLES=ON

      - name: Build and Install Shared
        working-directory: build/shared
        run: ninja install

      - name: Build and Install Static
        working-directory: build/static
        run: ninja install

      - name: Check Artifacts
        uses: andstor/file-existence-action@v3
        with:
          files: "install/shared/lib/libusb.so, install/shared/include/usb.h, install/static/lib/libusb.a"
          fail: true

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: src

      - name: Install dependencies
        run: brew install pkg-config libusb ninja

      - name: Configure CMake
        run: |
          cmake -B build/shared -S src -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install/shared -DBUILD_SHARED_LIBS=ON -DENABLE_EXAMPLES=ON
          cmake -B build/static -S src -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install/static -DBUILD_SHARED_LIBS=OFF -DENABLE_EXAMPLES=ON

      - name: Build and Install Shared
        working-directory: build/shared
        run: ninja install

      - name: Build and Install Static
        working-directory: build/static
        run: ninja install

      - name: Check Artifacts
        uses: andstor/file-existence-action@v3
        with:
          files: "install/shared/lib/libusb.dylib, install/shared/include/usb.h, install/static/lib/libusb.a"
          fail: true

  windows-mingw-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          path: src

      - name: Setup MSYS2 Environments
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-libusb

      - name: Configure CMake
        run: |
          cmake -B build/shared -S src -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install/shared -DBUILD_SHARED_LIBS=ON -DENABLE_EXAMPLES=ON
          cmake -B build/static -S src -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install/static -DBUILD_SHARED_LIBS=OFF -DENABLE_EXAMPLES=ON

      - name: Build and Install Shared
        working-directory: build/shared
        run: ninja install

      - name: Build and Install Static
        working-directory: build/static
        run: ninja install

      - name: Check Artifacts
        uses: andstor/file-existence-action@v3
        with:
          files: "install/shared/bin/libusb.dll, install/shared/lib/libusb.dll.a, install/static/lib/libusb.a"
          fail: true

  windows-msvc-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: src

      - name: Install dependencies via Chocolatey
        run: choco install ninja

      # Note: Vcpkg can provide backend libusb-1.0 seamlessly for native MSVC runs
      - name: Setup vcpkg for libusb backend
        run: vcpkg install libusb:x64-windows

      - name: Configure Toolchain and Options
        run: |
          cmake -B build/msvc -S src -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX=install/msvc -DENABLE_EXAMPLES=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build and Deploy (MSVC Multi-Config)
        run: cmake --build build/msvc --config Release --target install

      - name: Check Artifacts
        uses: andstor/file-existence-action@v3
        with:
          files: "install/msvc/bin/usb.dll, install/msvc/lib/libusb.lib, install/msvc/include/usb.h"
          fail: true
